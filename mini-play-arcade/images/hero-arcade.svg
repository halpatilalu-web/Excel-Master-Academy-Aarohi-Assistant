<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" fill="none" role="img" aria-label="Futuristic Neon Arcade Controller and Game Portals">
  <defs>
    <linearGradient id="hGrad1" x1="60" y1="40" x2="500" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="hCard" x1="120" y1="80" x2="440" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#151b3d"/>
      <stop offset="100%" stop-color="#0b1026"/>
    </linearGradient>
    <radialGradient id="hGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070814" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="280" cy="220" r="210" fill="url(#hGlow)"/>
  <!-- Orbiting neon rings -->
  <ellipse cx="280" cy="235" rx="225" ry="72" transform="rotate(-14 280 235)" stroke="url(#hGrad1)" stroke-width="2.2" stroke-dasharray="10 8" opacity="0.7"/>
  <ellipse cx="280" cy="235" rx="185" ry="54" transform="rotate(16 280 235)" stroke="#22d3ee" stroke-width="1.6" opacity="0.45"/>

  <!-- Floating mini cards -->
  <g transform="translate(56, 66)">
    <rect width="118" height="74" rx="16" fill="#111736" stroke="#a855f7" stroke-width="2"/>
    <polygon points="34,50 60,36 86,50 60,62" fill="#a855f7"/>
    <polygon points="38,38 60,26 82,38 60,49" fill="#38bdf8"/>
    <polygon points="43,26 60,16 77,26 60,35" fill="#22d3ee"/>
  </g>

  <g transform="translate(388, 56)">
    <rect width="122" height="76" rx="16" fill="#111736" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="42" cy="40" r="18" stroke="#f43f5e" stroke-width="5"/>
    <path d="M42 22 A18 18 0 0 1 60 40" stroke="#22d3ee" stroke-width="5"/>
    <circle cx="88" cy="38" r="10" fill="#facc15"/>
  </g>

  <!-- Central Glass Arcade Console -->
  <rect x="130" y="120" width="300" height="205" rx="30" fill="url(#hCard)" stroke="url(#hGrad1)" stroke-width="3"/>
  <rect x="150" y="140" width="260" height="118" rx="18" fill="#070a19" stroke="#1e293b" stroke-width="2"/>

  <!-- Tower + Score HUD inside console screen -->
  <text x="168" y="164" fill="#22d3ee" font-family="monospace" font-size="13" font-weight="700">SCORE 12,480</text>
  <text x="336" y="164" fill="#c084fc" font-family="monospace" font-size="13" font-weight="700">COMBO x8</text>
  <rect x="218" y="226" width="124" height="16" rx="5" fill="#3b82f6"/>
  <rect x="228" y="206" width="104" height="16" rx="5" fill="#8b5cf6"/>
  <rect x="238" y="186" width="84" height="16" rx="5" fill="#06b6d4"/>
  <circle cx="190" cy="205" r="11" fill="#f43f5e"/>
  <circle cx="372" cy="198" r="9" fill="#facc15"/>

  <!-- Gamepad Controls -->
  <g transform="translate(178, 274)">
    <circle cx="24" cy="22" r="20" fill="#131b3a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M24 12V32M14 22H34" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(324, 274)">
    <circle cx="16" cy="22" r="9" fill="#a855f7"/>
    <circle cx="42" cy="14" r="9" fill="#06b6d4"/>
    <circle cx="42" cy="32" r="9" fill="#f43f5e"/>
  </g>

  <!-- Trophy Floating Pill -->
  <g transform="translate(185, 348)">
    <rect width="190" height="46" rx="23" fill="#111836" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="28" cy="23" r="13" fill="#facc15" fill-opacity="0.2"/>
    <text x="21" y="28" font-size="15">🏆</text>
    <text x="50" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">DAILY CHALLENGE LIVE</text>
  </g>
</svg>
