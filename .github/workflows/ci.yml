name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Type-check + build frontend
        run: corepack pnpm build

      - name: Frontend unit tests
        run: corepack pnpm test:web

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install -r server/requirements-dev.txt
          python -m pip install ruff

      - name: Lint backend
        run: python -m ruff check server scripts

      - name: Validate course data
        run: python scripts/check_data.py

      - name: Run backend tests
        run: python -m pytest server -q

      - name: Audit dependencies
        run: |
          corepack pnpm audit --audit-level high
          python -m pip install pip-audit
          python -m pip_audit -r server/requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t excel-master-academy:ci .
